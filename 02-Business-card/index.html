<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="business-card">
        <img class="profile-image" src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="profile picture">
        <p class="full-name">Vitti Jannya</p>
        <p class="designation">Data Scientist</p>
        <p class="company">Amazon</p>
        <hr>
        <p class="email">jannyavitti@amazon.com</p>
        <p class="phone">+123-456-7890</p>
        <a class="portfolio-link" href="" target="_blank">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a class="media" href="#">LinkedIn</a>
            <a class="media" href="#">Twitter</a>
            <a class="media" href="#">GitHub</a>
        </div>
    </div>
</body>
</html>
