<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Styled To-Do List</title>
</head>
<body>
    <div class="section">
        <h1>My To-Do List</h1>
        <ul class="todo-list">
            <li><div class="container">
                <label for="first-list"><input type="checkbox">Finish Homework</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.microsoft.com" target="_blank">Ms Teams</a></li>
                </ul>
            </div></li>

            <li><div class="container">
                <label for="second-list"><input type="checkbox">Listen to podcasts</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://music.youtube.com" target="_blank">Youtube Music</a></li>
                </ul>
            </div></li>

            <li><div class="container">
                <label for="third-list"><input type="checkbox">Checkout some new clothes</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.shopee.co.id" target="_blank">Shopee</a></li>
                </ul>
            </div></li>

            <li><div class="container">
                <label for="fourth-list"><input type="checkbox">Watch a movie</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.netflix.com" target="_blank">Netflix</a></li>
                </ul>
            </div></li>
        </ul>
    </div>
</body>
</html>
